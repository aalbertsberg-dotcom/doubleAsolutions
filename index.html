<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>A³ Solutions | Microsoft 365, Security & Infrastructure Consulting</title>
  <meta name="description" content="Microsoft 365, security, and infrastructure engineered to perform. Built right. Built to last. A³ Solutions helps businesses build IT that actually works." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="logo.png" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- React and Babel from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Logo transparency fix */
    img[src*="logo.png"],
    img[src*="logo"],
    img[alt*="logo"],
    img[alt*="A³ Solutions logo"] {
      mix-blend-mode: multiply;
      background: transparent !important;
    }
    
    .logo-container img,
    nav img,
    header img {
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
    }
    
    :root {
      --bg: #070b1f;
      --bg-2: #0a0e27;
      --panel: rgba(15, 23, 42, 0.72);
      --panel-2: rgba(30, 58, 138, 0.12);
      --cyan: #06b6d4;
      --cyan-2: #22d3ee;
      --blue: #0284c7;
      --text: #e8edf4;
      --muted: #94a3b8;
      --muted-2: #64748b;
      --border: rgba(6, 182, 212, 0.24);
      --border-strong: rgba(6, 182, 212, 0.42);
      --shadow: rgba(6, 182, 212, 0.22);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(6, 182, 212, 0.10), transparent 28%),
        radial-gradient(circle at 80% 5%, rgba(2, 132, 199, 0.12), transparent 30%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    a {
      color: inherit;
    }

    .tech-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(6, 182, 212, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.035) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, black 0%, transparent 85%);
      pointer-events: none;
      z-index: 0;
    }

    .page-shell {
      position: relative;
      z-index: 1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.9rem;
      background: rgba(6, 182, 212, 0.10);
      border: 1px solid rgba(6, 182, 212, 0.28);
      border-radius: 999px;
      color: var(--cyan-2);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
      animation: pulse 2s ease-in-out infinite;
      flex: 0 0 auto;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.52; transform: scale(0.86); }
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 0.68rem;
      text-decoration: none;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      position: relative;
      flex: 0 0 auto;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.14));
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .brand-name {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    .brand-name sup {
      color: var(--cyan-2);
      font-size: 0.52em;
      margin-left: 1px;
      position: relative;
      top: -0.42em;
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.24);
    }

    .brand-tag {
      margin-top: 0.28rem;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.045em;
      text-transform: uppercase;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 0.82rem 0;
      transition: all 0.25s ease;
    }

    nav.scrolled {
      background: rgba(7, 11, 31, 0.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(6, 182, 212, 0.18);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.25);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 1.45rem;
    }

    .nav-link {
      position: relative;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.25s ease;
      padding: 0.35rem 0;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2px;
      width: 0;
      background: var(--cyan);
      transition: width 0.25s ease;
    }

    .nav-link:hover {
      color: var(--cyan-2);
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .nav-cta {
      border: 1px solid rgba(6, 182, 212, 0.36);
      border-radius: 999px;
      padding: 0.7rem 1rem;
      color: var(--cyan-2);
      text-decoration: none;
      font-weight: 700;
      transition: all 0.25s ease;
      background: rgba(6, 182, 212, 0.06);
    }

    .nav-cta:hover {
      background: rgba(6, 182, 212, 0.14);
      transform: translateY(-1px);
    }

    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: 0;
      color: var(--cyan-2);
      font-size: 1.75rem;
      cursor: pointer;
      line-height: 1;
    }

    .mobile-menu {
      display: none;
    }

    .btn-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary,
    .btn-secondary {
      border: 0;
      border-radius: 10px;
      padding: 0.9rem 1.35rem;
      min-width: 160px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: white;
      box-shadow: 0 14px 36px rgba(6, 182, 212, 0.24);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 42px rgba(6, 182, 212, 0.34);
    }

    .btn-secondary {
      background: rgba(6, 182, 212, 0.05);
      color: var(--cyan-2);
      border: 1px solid rgba(6, 182, 212, 0.42);
    }

    .btn-secondary:hover {
      background: rgba(6, 182, 212, 0.12);
      transform: translateY(-2px);
    }

    .hero {
      min-height: 70vh;
      display: grid;
      place-items: center;
      padding: 3rem 0 3rem;
      text-align: center;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: min(720px, 85vw);
      height: min(720px, 85vw);
      background: radial-gradient(circle, rgba(6, 182, 212, 0.13), transparent 62%);
      pointer-events: none;
      z-index: -1;
    }

    .hero-logo {
      width: clamp(112px, 15vw, 168px);
      height: clamp(112px, 15vw, 168px);
      margin: 0 auto 1.65rem;
      position: relative;
      display: grid;
      place-items: center;
    }

    .hero-logo::before {
      content: "";
      position: absolute;
      inset: -22px;
      border-radius: 36px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.16), transparent 70%);
      filter: blur(14px);
      z-index: -1;
    }

    .hero-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 28px;
      filter: drop-shadow(0 28px 48px rgba(0, 0, 0, 0.42)) drop-shadow(0 0 24px rgba(6, 182, 212, 0.18));
    }

    h1 {
      font-size: clamp(2.75rem, 7vw, 5.6rem);
      line-height: 0.98;
      letter-spacing: -0.068em;
      font-weight: 800;
      margin: 1.15rem auto 1.15rem;
      max-width: 980px;
      background: linear-gradient(135deg, #ffffff 8%, #dbeafe 42%, var(--cyan-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-copy {
      max-width: 690px;
      margin: 0 auto 0.9rem;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.3vw, 1.24rem);
      line-height: 1.62;
    }

    .hero-brand-line {
      color: var(--cyan-2);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 2.2rem;
      letter-spacing: 0.035em;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.9rem;
      max-width: 720px;
      margin: 3.7rem auto 0;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.46);
      border: 1px solid rgba(6, 182, 212, 0.16);
      border-radius: 16px;
      padding: 1.15rem 0.95rem;
      backdrop-filter: blur(10px);
    }

    .stat-number {
      color: var(--cyan-2);
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 800;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 0.35rem;
    }

    section {
      padding: 7.5rem 0;
      position: relative;
    }

    .section-header {
      text-align: center;
      margin: 0 auto 4rem;
      max-width: 760px;
    }

    h2 {
      font-size: clamp(2rem, 5vw, 3.45rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 1.12rem;
      line-height: 1.65;
    }

    .services-section,
    .about-section,
    .contact-section {
      background: rgba(15, 21, 53, 0.34);
      border-top: 1px solid rgba(6, 182, 212, 0.08);
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.4rem;
    }

    .service-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 2rem;
      background:
        linear-gradient(180deg, rgba(30, 58, 138, 0.18), rgba(15, 23, 42, 0.48));
      transition: all 0.25s ease;
      min-height: 100%;
    }

    .service-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(6, 182, 212, 0.16), transparent 42%);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .service-card:hover {
      transform: translateY(-6px);
      border-color: var(--border-strong);
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.24);
    }

    .service-card:hover::before {
      opacity: 1;
    }

    .service-top {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.1rem;
    }

    .service-icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(6, 182, 212, 0.11);
      border: 1px solid rgba(6, 182, 212, 0.24);
      color: var(--cyan-2);
      flex: 0 0 auto;
    }

    .service-card h3 {
      font-size: 1.35rem;
      line-height: 1.12;
      letter-spacing: -0.02em;
      margin-bottom: 0.45rem;
    }

    .service-kicker {
      color: var(--cyan-2);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .service-card p {
      position: relative;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 1.35rem;
    }

    .feature-list {
      position: relative;
      list-style: none;
      display: grid;
      gap: 0.7rem;
    }

    .feature-list li {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: var(--text);
      font-size: 0.94rem;
    }

    .feature-list i {
      color: var(--cyan-2);
      flex: 0 0 auto;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.04fr 0.96fr;
      gap: 3rem;
      align-items: start;
    }

    .about-copy p {
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.8;
      margin-bottom: 1.3rem;
    }

    .brand-meaning {
      margin-top: 1.75rem;
      padding: 1.4rem;
      border: 1px solid rgba(6, 182, 212, 0.24);
      background: rgba(6, 182, 212, 0.06);
      border-radius: 18px;
    }

    .brand-meaning strong {
      color: var(--cyan-2);
    }

    .profile-card,
    .expertise-card {
      border: 1px solid rgba(6, 182, 212, 0.24);
      background:
        linear-gradient(180deg, rgba(30, 58, 138, 0.16), rgba(15, 23, 42, 0.55));
      border-radius: 22px;
      padding: 2rem;
    }

    .profile-card {
      margin-bottom: 1.4rem;
    }

    .profile-card h3,
    .expertise-card h3 {
      font-size: 1.35rem;
      margin-bottom: 1rem;
    }

    .profile-name {
      color: var(--text);
      font-weight: 800;
      margin-bottom: 0.8rem;
    }

    .profile-card p {
      color: var(--muted);
      line-height: 1.75;
    }

    .skills-grid {
      display: grid;
      gap: 0.78rem;
    }

    .skill-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.82rem;
      border-radius: 12px;
      background: rgba(6, 182, 212, 0.045);
      color: var(--text);
    }

    .skill-item i {
      color: var(--cyan-2);
      flex: 0 0 auto;
    }

    .portfolio-link {
      color: var(--text);
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .portfolio-link:hover {
      color: var(--cyan-2);
    }

    .contact-card {
      max-width: 820px;
      margin: 0 auto;
      border: 1px solid rgba(6, 182, 212, 0.26);
      background:
        radial-gradient(circle at top, rgba(6, 182, 212, 0.09), transparent 45%),
        rgba(15, 23, 42, 0.62);
      border-radius: 24px;
      padding: clamp(1.4rem, 4vw, 3rem);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.22);
    }

    form {
      display: grid;
      gap: 1.25rem;
    }

    label {
      display: block;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    input,
    textarea {
      width: 100%;
      background: rgba(30, 58, 138, 0.18);
      border: 1px solid rgba(6, 182, 212, 0.26);
      color: var(--text);
      padding: 0.92rem;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.25s ease;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.10);
    }

    textarea {
      min-height: 155px;
      resize: vertical;
    }

    .form-status {
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      font-weight: 700;
    }

    .form-success {
      background: rgba(6, 182, 212, 0.10);
      border: 1px solid var(--cyan);
      color: var(--cyan-2);
    }

    .form-error {
      background: rgba(239, 68, 68, 0.10);
      border: 1px solid #ef4444;
      color: #f87171;
    }

    .contact-info {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 2.5rem;
      color: var(--muted);
    }

    .contact-method {
      text-align: center;
    }

    .contact-method i {
      color: var(--cyan-2);
      margin-bottom: 0.5rem;
    }

    .contact-method strong {
      display: block;
      color: var(--text);
      margin-top: 0.3rem;
    }

    footer {
      padding: 3rem 0;
      border-top: 1px solid rgba(6, 182, 212, 0.16);
      background: rgba(7, 11, 31, 0.5);
      text-align: center;
    }

    .footer-lockup {
      justify-content: center;
      margin-bottom: 1rem;
    }

    footer p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .services-grid,
      .about-grid {
        grid-template-columns: 1fr;
      }

      .desktop-nav {
        display: none;
      }

      .mobile-menu-btn {
        display: block;
      }

      .mobile-menu {
        position: fixed;
        top: 0;
        right: 0;
        width: min(285px, 82vw);
        height: 100vh;
        display: block;
        padding: 6rem 2rem 2rem;
        background: rgba(7, 11, 31, 0.96);
        border-left: 1px solid rgba(6, 182, 212, 0.18);
        transform: translateX(100%);
        transition: transform 0.25s ease;
        z-index: 99;
        box-shadow: -24px 0 60px rgba(0, 0, 0, 0.35);
      }

      .mobile-menu.open {
        transform: translateX(0);
      }

      .mobile-menu a {
        display: block;
        text-decoration: none;
        padding: 1rem 0;
        color: var(--text);
        font-weight: 700;
        border-bottom: 1px solid rgba(6, 182, 212, 0.10);
      }
    }

    @media (max-width: 640px) {
      .container {
        padding: 0 1rem;
      }

      nav {
        padding: 0.9rem 0;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
      }

      .brand-name {
        font-size: 1.05rem;
      }

      .brand-tag {
        font-size: 0.62rem;
      }

      .hero {
        padding-top: 2.5rem;
      }

      h1 {
        font-size: clamp(2.45rem, 14vw, 3.6rem);
      }

      .hero-stats {
        grid-template-columns: 1fr;
        margin-top: 3rem;
      }

      section {
        padding: 5.5rem 0;
      }

      .service-card,
      .profile-card,
      .expertise-card {
        padding: 1.35rem;
      }

      .service-top {
        flex-direction: column;
      }

      .btn-primary,
      .btn-secondary {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useState } = React;

    const Icon = ({ name, size = 22, ...props }) => {
      useEffect(() => {
        lucide.createIcons();
      }, []);

      return React.createElement("i", {
        "data-lucide": name,
        ...props,
        style: { width: size, height: size, ...(props.style || {}) }
      });
    };

    const BrandLockup = ({ footer = false }) => (
      <a href="#top" className={`brand-lockup ${footer ? "footer-lockup" : ""}`} aria-label="A cubed Solutions home">
        <div className="brand-mark">
          <img src="logo.png" alt="A³ Solutions logo" />
        </div>
        <div className="brand-text">
          <div className="brand-name">A<sup>3</sup> Solutions</div>
          <div className="brand-tag">From Core to Cloud</div>
        </div>
      </a>
    );

    const A3Solutions = () => {
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      const [formStatus, setFormStatus] = useState("");

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 44);
        handleScroll();
        window.addEventListener("scroll", handleScroll);
        lucide.createIcons();
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      useEffect(() => {
        lucide.createIcons();
      });

      const scrollTo = (id) => {
        setIsMenuOpen(false);
        document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setFormStatus("submitting");

        const form = e.target;
        const data = new FormData(form);

        try {
          const response = await fetch("https://formspree.io/f/mbdaajzd", {
            method: "POST",
            body: data,
            headers: { Accept: "application/json" }
          });

          if (response.ok) {
            setFormStatus("success");
            form.reset();
            setTimeout(() => setFormStatus(""), 5000);
          } else {
            setFormStatus("error");
          }
        } catch {
          setFormStatus("error");
        }
      };

      const stats = [
        { number: "15+", label: "Years Experience" },
        { number: "A³", label: "Architecture. Automation. Authority." },
        { number: "M365", label: "Cloud & Security Focus" }
      ];
