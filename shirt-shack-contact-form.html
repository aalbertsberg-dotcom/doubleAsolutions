<!-- SHIRT SHACK WEBSITE - CONTACT FORM WITH GROUPME -->
<!-- Add this to the contact section of Shirt Shack's website -->

<section class="contact-section" id="contact">
    <div class="container">
        <h2>Get a Quote or Contact Us</h2>
        <p>Fill out the form and we'll get back to you ASAP!</p>
        
        <form id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="name">Your Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="(228) 555-0000">
            </div>
            
            <div class="form-group">
                <label for="service">What do you need? *</label>
                <select id="service" name="service" required>
                    <option value="">-- Select Service --</option>
                    <option value="screen-printing">Screen Printing</option>
                    <option value="embroidery">Embroidery</option>
                    <option value="hats">Hats & Caps</option>
                    <option value="uniforms">Uniforms / Workwear</option>
                    <option value="bulk-order">Bulk Order</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="quantity">How many pieces?</label>
                <input type="text" id="quantity" name="quantity" placeholder="e.g., 50 t-shirts">
            </div>
            
            <div class="form-group">
                <label for="message">Tell us more about your project *</label>
                <textarea id="message" name="message" rows="5" required placeholder="Colors, sizes, design ideas, deadline, etc."></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Send Quote Request</button>
            <div id="formStatus" class="form-status"></div>
        </form>
    </div>
</section>

<style>
    .contact-section {
        padding: 60px 20px;
        background: #f8f9fa;
    }
    
    .contact-section h2 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
        font-size: 32px;
    }
    
    .contact-section p {
        text-align: center;
        color: #666;
        margin-bottom: 40px;
    }
    
    .contact-form {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 6px;
        font-size: 16px;
        font-family: inherit;
        transition: border-color 0.3s;
    }
    
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #06b6d4;
    }
    
    .submit-btn {
        width: 100%;
        padding: 15px;
        background: #06b6d4;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .submit-btn:hover {
        background: #0284c7;
        transform: translateY(-2px);
    }
    
    .form-status {
        margin-top: 15px;
        padding: 12px;
        border-radius: 6px;
        text-align: center;
        font-weight: 600;
        display: none;
    }
    
    .form-status.success {
        background: #d1fae5;
        color: #065f46;
        display: block;
    }
    
    .form-status.error {
        background: #fee2e2;
        color: #991b1b;
        display: block;
    }
</style>

<script>
    document.getElementById('contactForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formStatus = document.getElementById('formStatus');
        const submitBtn = e.target.querySelector('.submit-btn');
        
        // Disable button while submitting
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending...';
        
        // Get form data
        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value || 'Not provided',
            service: document.getElementById('service').value,
            quantity: document.getElementById('quantity').value || 'Not specified',
            message: document.getElementById('message').value
        };
        
        // Format message for GroupMe
        const groupMeMessage = `
🎨 NEW QUOTE REQUEST - Shirt Shack

👤 Name: ${formData.name}
📧 Email: ${formData.email}
📞 Phone: ${formData.phone}
🛍️ Service: ${formData.service}
📦 Quantity: ${formData.quantity}

💬 Message:
${formData.message}

⏰ Submitted: ${new Date().toLocaleString()}
        `.trim();
        
        try {
            // Send to GroupMe
            const botId = 'YOUR_GROUPME_BOT_ID_HERE'; // Replace with actual bot ID
            
            await fetch('https://api.groupme.com/v3/bots/post', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    bot_id: botId,
                    text: groupMeMessage
                })
            });
            
            // Also send email (optional - using Formspree or similar)
            // Uncomment if you want email backup:
            /*
            await fetch('https://formspree.io/f/YOUR_FORMSPREE_ID', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            });
            */
            
            // Show success message
            formStatus.className = 'form-status success';
            formStatus.textContent = '✓ Thanks! We got your request and will get back to you soon!';
            
            // Reset form
            e.target.reset();
            
        } catch (error) {
            // Show error message
            formStatus.className = 'form-status error';
            formStatus.textContent = 'Oops! Something went wrong. Please call us at (228) 861-6587.';
        } finally {
            // Re-enable button
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Quote Request';
        }
    });
</script>
