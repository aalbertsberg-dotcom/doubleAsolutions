<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction</title>

  <!-- Favicon: inline SVG via data URI -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%231e3a8a'/%3E%3Cstop offset='100%25' style='stop-color:%230c1e47'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M100 20L170 60L170 140L100 180L30 140L30 60Z' fill='url(%23g)' stroke='%2306b6d4' stroke-width='3'/%3E%3Ctext x='100' y='120' font-family='Arial' font-size='70' font-weight='bold' fill='%2306b6d4' text-anchor='middle'%3EAA%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy-deep:  #060e22;
      --navy-mid:   #0c1e47;
      --navy-light: #1e3a8a;
      --cyan:       #06b6d4;
      --cyan-dim:   rgba(6,182,212,.18);
      --white:      #e8f0fe;
      --muted:      #6b84b8;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--navy-deep);
      color: var(--white);
      font-family: 'Sora', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Grid background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--cyan-dim) 1px, transparent 1px),
        linear-gradient(90deg, var(--cyan-dim) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Glow blobs ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 40% at 20% 30%, rgba(30,58,138,.55), transparent),
        radial-gradient(ellipse 40% 35% at 80% 70%, rgba(6,182,212,.12), transparent);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Animated hex ring decoration ── */
    .hex-ring {
      position: fixed;
      width: 600px;
      height: 600px;
      border: 1px solid rgba(6,182,212,.08);
      clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: spin 40s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    .hex-ring:nth-child(2) {
      width: 820px;
      height: 820px;
      border-color: rgba(6,182,212,.05);
      animation-duration: 60s;
      animation-direction: reverse;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ── Main card ── */
    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      padding: 0 1.5rem;
      animation: fadeUp .9s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo ── */
    .logo {
      width: 110px;
      height: 110px;
      margin-bottom: 2.2rem;
      filter: drop-shadow(0 0 18px rgba(6,182,212,.45));
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 18px rgba(6,182,212,.45)); }
      50%       { filter: drop-shadow(0 0 32px rgba(6,182,212,.75)); }
    }

    /* ── Status badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--cyan);
      background: var(--cyan-dim);
      border: 1px solid rgba(6,182,212,.35);
      padding: .35rem .9rem;
      border-radius: 2px;
      margin-bottom: 1.6rem;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: var(--cyan);
      border-radius: 50%;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: .2; }
    }

    /* ── Headline ── */
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 9vw, 6.5rem);
      letter-spacing: .04em;
      line-height: 1;
      color: var(--white);
      margin-bottom: 1.2rem;
    }

    h1 span {
      color: var(--cyan);
    }

    /* ── Sub copy ── */
    p {
      font-size: clamp(.9rem, 2vw, 1.05rem);
      color: var(--muted);
      line-height: 1.75;
      max-width: 480px;
      margin-bottom: 2.8rem;
    }

    /* ── Divider ── */
    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      margin-bottom: 2.8rem;
    }

    /* ── Footer ── */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      padding: 1rem 1.5rem;
      background: linear-gradient(to top, rgba(6,14,34,.95), transparent);
      font-size: .78rem;
      color: var(--muted);
      letter-spacing: .04em;
    }

    footer a {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
      transition: opacity .2s;
    }

    footer a:hover { opacity: .75; }

    footer .footer-logo {
      width: 22px;
      height: 22px;
      filter: drop-shadow(0 0 4px rgba(6,182,212,.5));
    }
  </style>
</head>
<body>

  <!-- Decorative rings -->
  <div class="hex-ring"></div>
  <div class="hex-ring"></div>

  <main>

    <!-- Logo -->
    <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0c1e47;stop-opacity:1" />
        </linearGradient>
      </defs>
      <path d="M 100 20 L 170 60 L 170 140 L 100 180 L 30 140 L 30 60 Z"
            fill="url(#grad2)" stroke="#06b6d4" stroke-width="3" />
      <path d="M 100 35 L 155 65 L 155 135 L 100 165 L 45 135 L 45 65 Z"
            fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3" />
      <text x="100" y="120"
            font-family="Arial, sans-serif"
            font-size="70"
            font-weight="bold"
            fill="#06b6d4"
            text-anchor="middle">AA</text>
      <circle cx="100" cy="20" r="4" fill="#06b6d4" />
      <circle cx="170" cy="60" r="4" fill="#06b6d4" />
      <circle cx="170" cy="140" r="4" fill="#06b6d4" />
    </svg>

    <!-- Status badge -->
    <div class="badge">
      <span class="badge-dot"></span>
      Under Construction
    </div>

    <!-- Headline -->
    <h1>We'll be<br /><span>back soon.</span></h1>

    <div class="divider"></div>

    <!-- Message -->
    <p>We're sorry — this page is currently under construction.<br />
       Something great is on its way. Check back soon.</p>

  </main>

  <!-- Footer -->
  <footer>
    <span>Built by:</span>
    <a href="https://aalbertsberg.us" target="_blank" rel="noopener">
      <svg class="footer-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fgrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0c1e47;stop-opacity:1" />
          </linearGradient>
        </defs>
        <path d="M 100 20 L 170 60 L 170 140 L 100 180 L 30 140 L 30 60 Z"
              fill="url(#fgrad)" stroke="#06b6d4" stroke-width="3" />
        <path d="M 100 35 L 155 65 L 155 135 L 100 165 L 45 135 L 45 65 Z"
              fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3" />
        <text x="100" y="120"
              font-family="Arial, sans-serif"
              font-size="70"
              font-weight="bold"
              fill="#06b6d4"
              text-anchor="middle">AA</text>
        <circle cx="100" cy="20" r="4" fill="#06b6d4" />
        <circle cx="170" cy="60" r="4" fill="#06b6d4" />
        <circle cx="170" cy="140" r="4" fill="#06b6d4" />
      </svg>
      Double-A Solutions
    </a>
  </footer>

</body>
</html>
